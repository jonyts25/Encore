<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Ficha del show</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#C8361F}a:hover{color:#A12A17}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F2F2F7; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; color: #111114">

<div style="position: relative; height: 300px; background: radial-gradient(circle at 28% 30%, rgba(255,164,92,0.65), rgba(255,164,92,0) 42%), radial-gradient(circle at 78% 36%, rgba(122,92,255,0.6), rgba(122,92,255,0) 40%), linear-gradient(180deg, #1B1024 0%, #07060C 100%)">
<div style="position: absolute; top: 110px; left: 0; right: 0; text-align: center; font-size: 11px; color: rgba(255,255,255,0.55)">[foto del artista]</div>
<div style="position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,0.25) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0.8) 100%)"></div>
<button aria-label="Atrás" style="position: absolute; top: 56px; left: 16px; width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.22); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(255,255,255,0.35); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
</button>
<button aria-label="Compartir" style="position: absolute; top: 56px; right: 16px; width: 44px; height: 44px; border-radius: 22px; background: rgba(255,255,255,0.22); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 1px solid rgba(255,255,255,0.35); color: #FFFFFF; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13"></path><polyline points="7 8 12 3 17 8"></polyline><path d="M5 12v8h14v-8"></path></svg>
</button>
<div style="position: absolute; left: 20px; right: 20px; bottom: 18px; color: #FFFFFF">
<div style="font-size: 36px; font-weight: 800; letter-spacing: -0.8px">Elefante</div>
<div style="font-size: 15px; color: rgba(255,255,255,0.88)">Tour 30 aniversario</div>
</div>
</div>

<div style="padding: 16px 20px 0 20px; display: flex; flex-direction: column; gap: 14px">

<div style="background: #FFFFFF; border-radius: 20px; padding: 0 16px">
<div style="display: flex; align-items: center; gap: 12px; height: 54px; border-bottom: 1px solid #E5E5EA">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>
<div style="font-size: 16px">Jueves 29 de octubre · 21:00</div>
</div>
<div style="display: flex; align-items: center; gap: 12px; height: 54px">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>
<div style="font-size: 16px; flex: 1">Arena Guadalajara</div>
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#AEAEB2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"></polyline></svg>
</div>
</div>

<div role="group" aria-label="Tu estado" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px; padding: 3px; border-radius: 12px; background: #E3E3E8">
<button style="height: 36px; border-radius: 9px; border: none; background: transparent; color: #111114; font-size: 14px; font-weight: 500">Interesado</button>
<button aria-pressed="true" style="height: 36px; border-radius: 9px; border: none; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.12); color: #111114; font-size: 14px; font-weight: 700">Voy</button>
<button disabled style="height: 36px; border-radius: 9px; border: none; background: transparent; color: #8E8E93; font-size: 14px; font-weight: 500">Fui</button>
</div>

<div style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
<div style="width: 36px; height: 36px; border-radius: 18px; background: #E3F4E6; color: #1E7A34; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12 9 17 20 6"></polyline></svg>
</div>
<div style="flex: 1; display: flex; flex-direction: column; gap: 1px">
<div style="font-size: 16px; font-weight: 600">Listo sin señal</div>
<div style="font-size: 13px; color: #5E5E63">24 de 26 letras · actualizado hace 2 h</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 2px; margin-top: 4px">
<h2 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.3px">Setlist probable</h2>
<div style="font-size: 14px; color: #5E5E63">Según 8 shows de esta gira · cambia poco</div>
</div>

<div style="background: #FFFFFF; border-radius: 20px; padding: 0 16px">
<sc-for list="{{songs}}" as="song" hint-placeholder-count="5">
<div style="display: flex; align-items: center; gap: 12px; height: 52px; border-bottom: 1px solid #E5E5EA">
<div style="width: 22px; font-size: 15px; color: #8E8E93; font-variant-numeric: tabular-nums">{{song.n}}</div>
<div style="flex: 1; font-size: 16px">{{song.title}}</div>
<div style="font-size: 13px; color: #5E5E63; font-variant-numeric: tabular-nums">{{song.pct}}</div>
</div>
</sc-for>
</div>

</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 120px; background: linear-gradient(180deg, rgba(242,242,247,0) 0%, rgba(242,242,247,0.9) 60%)"></div>
<div style="position: absolute; left: 20px; right: 20px; bottom: 30px; display: flex; gap: 10px">
<button style="flex: 1; height: 54px; border-radius: 27px; border: none; background: {{accent}}; color: #FFFFFF; font-size: 17px; font-weight: 700; box-shadow: 0 8px 24px rgba(200,54,31,0.3)">Practicar letras</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C8361F","options":["#C8361F","#6E3BD8","#0A7C6B","#B8337A"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      accent: this.props.accent ?? '#C8361F',
      songs: [
        { n: 1, title: 'El que busca encuentra', pct: '100%' },
        { n: 2, title: 'De la noche a la mañana', pct: '100%' },
        { n: 3, title: 'Durmiendo con la luna', pct: '88%' },
        { n: 4, title: 'La que se fue', pct: '75%' },
        { n: 5, title: 'Sabor a chocolate', pct: '63%' }
      ]
    };
  }
}
</script>
</body>
</html>
